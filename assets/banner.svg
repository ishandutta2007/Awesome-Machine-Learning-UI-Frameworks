<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d18"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#ec4899"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="cyan-accent" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="pill-bg" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".1"/><stop offset="100%" stop-color="#fff" stop-opacity=".03"/></linearGradient><filter id="glow-blur" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="60"/></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes orb-float-1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-25px) scale(1.08)}}@keyframes orb-float-2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-35px,30px) scale(1.12)}}@keyframes pulse-wave{0%{opacity:.25;stroke-dashoffset:0}50%{opacity:.55;stroke-dashoffset:-30}}@keyframes pill-pulse{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}.badge-text,.brand-subtitle,.brand-title,.tagline-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.brand-title{font-weight:800;font-size:50px;letter-spacing:-.5px;fill:#fff}.brand-subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text,.tagline-text{font-weight:600;font-size:13px;fill:#e2e8f0}.tagline-text{font-size:14px;fill:#a5b4fc;letter-spacing:2px;text-transform:uppercase}.orb-1{animation:orb-float-1 9s ease-in-out infinite}.orb-2{animation:orb-float-2 11s ease-in-out infinite}.wave-line{stroke-dasharray:8 12;animation:pulse-wave 6s linear infinite}.pill-anim-1{animation:pill-pulse 4s ease-in-out infinite}.pill-anim-2{animation:pill-pulse 4.5s ease-in-out infinite .6s}.pill-anim-3{animation:pill-pulse 5s ease-in-out infinite 1.2s}.pill-anim-4{animation:pill-pulse 4.2s ease-in-out infinite 1.8s}.pill-anim-5{animation:pill-pulse 4.8s ease-in-out infinite 2.4s}</style><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".07"><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="350" y2="350"/><line x1="150" x2="150" y1="0" y2="420"/><line x1="300" x2="300" y1="0" y2="420"/><line x1="450" x2="450" y1="0" y2="420"/><line x1="600" x2="600" y1="0" y2="420"/><line x1="750" x2="750" y1="0" y2="420"/><line x1="900" x2="900" y1="0" y2="420"/><line x1="1050" x2="1050" y1="0" y2="420"/></g><g class="orb-1"><circle cx="220" cy="110" r="140" fill="#6366f1" filter="url(#glow-blur)" opacity=".28"/></g><g class="orb-2"><circle cx="980" cy="280" r="160" fill="#ec4899" filter="url(#glow-blur)" opacity=".22"/><circle cx="1020" cy="120" r="120" fill="#06b6d4" filter="url(#glow-blur)" opacity=".25"/></g><path fill="none" stroke="url(#primary-glow)" stroke-width="2.5" d="M 60,330 C 300,380 450,260 700,320 C 900,360 1020,300 1140,320" class="wave-line"/><path fill="none" stroke="url(#cyan-accent)" stroke-width="2" d="M 80,90 C 260,40 500,120 780,70 C 960,30 1060,90 1130,80" class="wave-line" opacity=".4"/><rect width="1198" height="418" x="1" y="1" fill="none" stroke="#334155" stroke-width="1.5" opacity=".5" rx="16"/><g transform="translate(80, 0)"><g transform="translate(0, 68)"><rect width="260" height="32" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity=".9" rx="16"/><circle cx="16" cy="16" r="4.5" fill="#a855f7" filter="url(#soft-glow)"/><text x="30" y="21" class="tagline-text">⚡ ML &amp; DATA APP ECOSYSTEM</text></g><g><text class="brand-title" transform="translate(0, 150)">Awesome Machine Learning UI</text></g><rect width="680" height="3" x="0" y="172" fill="url(#primary-glow)" rx="1.5"/><g><text class="brand-subtitle" transform="translate(0, 215)">Curated SaaS Platforms, Open-Source Frameworks &amp; Python-to-UI Engines</text><text x="0" y="32" fill="#64748b" class="brand-subtitle" font-size="16" transform="translate(0, 215)">Streamlit • Gradio • Dash • Reflex • Taipy • NiceGUI • Shiny • Voilà • Panel • Solara</text></g><g><g class="pill-anim-1" transform="translate(0, 310) translate(0, 0)"><rect width="130" height="40" fill="url(#pill-bg)" stroke="#ff4b4b" stroke-width="1.4" rx="20"/><circle cx="20" cy="20" r="5" fill="#ff4b4b"/><text x="34" y="25" class="badge-text">Streamlit</text></g><g class="pill-anim-2" transform="translate(0, 310) translate(145, 0)"><rect width="115" height="40" fill="url(#pill-bg)" stroke="#f59e0b" stroke-width="1.4" rx="20"/><circle cx="20" cy="20" r="5" fill="#f59e0b"/><text x="34" y="25" class="badge-text">Gradio</text></g><g class="pill-anim-3" transform="translate(0, 310) translate(275, 0)"><rect width="105" height="40" fill="url(#pill-bg)" stroke="#3b82f6" stroke-width="1.4" rx="20"/><circle cx="20" cy="20" r="5" fill="#3b82f6"/><text x="34" y="25" class="badge-text">Dash</text></g><g class="pill-anim-4" transform="translate(0, 310) translate(395, 0)"><rect width="115" height="40" fill="url(#pill-bg)" stroke="#8b5cf6" stroke-width="1.4" rx="20"/><circle cx="20" cy="20" r="5" fill="#8b5cf6"/><text x="34" y="25" class="badge-text">Reflex</text></g><g class="pill-anim-5" transform="translate(0, 310) translate(525, 0)"><rect width="110" height="40" fill="url(#pill-bg)" stroke="#ec4899" stroke-width="1.4" rx="20"/><circle cx="20" cy="20" r="5" fill="#