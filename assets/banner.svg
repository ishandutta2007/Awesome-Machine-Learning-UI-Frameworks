<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glass Pill Gradients -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 50px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .brand-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #a5b4fc;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Ambient Floating Animations */
    @keyframes orb-float-1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -25px) scale(1.08); }
    }
    @keyframes orb-float-2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-35px, 30px) scale(1.12); }
    }
    @keyframes pulse-wave {
      0%, 100% { opacity: 0.25; stroke-dashoffset: 0; }
      50% { opacity: 0.55; stroke-dashoffset: -30; }
    }
    @keyframes pill-pulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .orb-1 { animation: orb-float-1 9s ease-in-out infinite; }
    .orb-2 { animation: orb-float-2 11s ease-in-out infinite; }
    .wave-line {
      stroke-dasharray: 8 12;
      animation: pulse-wave 6s linear infinite;
    }
    .pill-anim-1 { animation: pill-pulse 4s ease-in-out infinite; }
    .pill-anim-2 { animation: pill-pulse 4.5s ease-in-out infinite 0.6s; }
    .pill-anim-3 { animation: pill-pulse 5s ease-in-out infinite 1.2s; }
    .pill-anim-4 { animation: pill-pulse 4.2s ease-in-out infinite 1.8s; }
    .pill-anim-5 { animation: pill-pulse 4.8s ease-in-out infinite 2.4s; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Background Decorative Grid -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Glowing Orbs in the background -->
  <g class="orb-1">
    <circle cx="220" cy="110" r="140" fill="#6366f1" opacity="0.28" filter="url(#glow-blur)" />
  </g>
  <g class="orb-2">
    <circle cx="980" cy="280" r="160" fill="#ec4899" opacity="0.22" filter="url(#glow-blur)" />
    <circle cx="1020" cy="120" r="120" fill="#06b6d4" opacity="0.25" filter="url(#glow-blur)" />
  </g>

  <!-- Dynamic Flow Connector Curves -->
  <path class="wave-line" d="M 60,330 C 300,380 450,260 700,320 C 900,360 1020,300 1140,320" fill="none" stroke="url(#primary-glow)" stroke-width="2.5" />
  <path class="wave-line" d="M 80,90 C 260,40 500,120 780,70 C 960,30 1060,90 1130,80" fill="none" stroke="url(#cyan-accent)" stroke-width="2" opacity="0.4" />

  <!-- Outer Rounded Border -->
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5" />

  <!-- Foreground Content (Guaranteed Never Obscured) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 68)">
      <rect width="260" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="16" r="4.5" fill="#a855f7" filter="url(#soft-glow)" />
      <text x="30" y="21" class="tagline-text">⚡ ML &amp; DATA APP ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <g transform="translate(0, 150)">
      <text class="brand-title">Awesome Machine Learning UI</text>
    </g>

    <!-- Gradient Subtitle Accent Line -->
    <rect x="0" y="172" width="680" height="3" rx="1.5" fill="url(#primary-glow)" />

    <!-- Subtitle Description -->
    <g transform="translate(0, 215)">
      <text class="brand-subtitle">
        Curated SaaS Platforms, Open-Source Frameworks &amp; Python-to-UI Engines
      </text>
      <text x="0" y="32" class="brand-subtitle" fill="#64748b" font-size="16">
        Streamlit • Gradio • Dash • Reflex • Taipy • NiceGUI • Shiny • Voilà • Panel • Solara
      </text>
    </g>

    <!-- Interactive / Floating Tech Pill Row (Dynamic floating animation) -->
    <g transform="translate(0, 310)">
      <!-- Pill 1: Streamlit -->
      <g class="pill-anim-1" transform="translate(0, 0)">
        <rect width="130" height="40" rx="20" fill="url(#pill-bg)" stroke="#ff4b4b" stroke-width="1.4" />
        <circle cx="20" cy="20" r="5" fill="#ff4b4b" />
        <text x="34" y="25" class="badge-text">Streamlit</text>
      </g>

      <!-- Pill 2: Gradio -->
      <g class="pill-anim-2" transform="translate(145, 0)">
        <rect width="115" height="40" rx="20" fill="url(#pill-bg)" stroke="#f59e0b" stroke-width="1.4" />
        <circle cx="20" cy="20" r="5" fill="#f59e0b" />
        <text x="34" y="25" class="badge-text">Gradio</text>
      </g>

      <!-- Pill 3: Dash -->
      <g class="pill-anim-3" transform="translate(275, 0)">
        <rect width="105" height="40" rx="20" fill="url(#pill-bg)" stroke="#3b82f6" stroke-width="1.4" />
        <circle cx="20" cy="20" r="5" fill="#3b82f6" />
        <text x="34" y="25" class="badge-text">Dash</text>
      </g>

      <!-- Pill 4: Reflex -->
      <g class="pill-anim-4" transform="translate(395, 0)">
        <rect width="115" height="40" rx="20" fill="url(#pill-bg)" stroke="#8b5cf6" stroke-width="1.4" />
        <circle cx="20" cy="20" r="5" fill="#8b5cf6" />
        <text x="34" y="25" class="badge-text">Reflex</text>
      </g>

      <!-- Pill 5: Taipy -->
      <g class="pill-anim-5" transform="translate(525, 0)">
        <rect width="110" height="40" rx="20" fill="url(#pill-bg)" stroke="#ec4899" stroke-width="1.4" />
        <circle cx="20" cy="20" r="5" fill="#ec4899" />
        <text x="34" y="25" class="badge-text">Taipy</text>
      </g>

      <!-- Pill 6: NiceGUI -->
      <g class="pill-anim-1" transform="translate(650, 0)">
        <rect width="120" height="40" rx="20" fill="url(#pill-bg)" stroke="#10b981" stroke-width="1.4" />
        <circle cx="20" cy="20" r="5" fill="#10b981" />
        <text x="34" y="25" class="badge-text">NiceGUI</text>
      </g>

      <!-- Pill 7: Shiny -->
      <g class="pill-anim-3" transform="translate(785, 0)">
        <rect width="105" height="40" rx="20" fill="url(#pill-bg)" stroke="#06b6d4" stroke-width="1.4" />
        <circle cx="20" cy="20" r="5" fill="#06b6d4" />
        <text x="34" y="25" class="badge-text">Shiny</text>
      </g>

      <!-- Pill 8: Open-Source -->
      <g class="pill-anim-2" transform="translate(905, 0)">
        <rect width="135" height="40" rx="20" fill="url(#pill-bg)" stroke="#a855f7" stroke-width="1.4" />
        <circle cx="20" cy="20" r="5" fill="#a855f7" />
        <text x="34" y="25" class="badge-text">100% Free / OSS</text>
      </g>
    </g>
  </g>
</svg>
